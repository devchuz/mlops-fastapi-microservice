name: Deploy FastAPI with QAS and PRD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mlops-fastapi-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_IMAGE: devchuz/mlops-fastapi-microservice

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-root

      - name: Run tests
        run: |
          poetry run python -m pytest tests/ -v

  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            devchuz/mlops-fastapi-microservice:latest
            devchuz/mlops-fastapi-microservice:${{ github.sha }}

  deploy_qas:
    name: Deploy to QAS - Modal
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: qas

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      DOCKER_IMAGE_TAG: devchuz/mlops-fastapi-microservice:${{ github.sha }}
      MODAL_APP_NAME: mlops-fastapi-qas

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          pip install modal

      - name: Deploy to Modal QAS
        run: |
          modal deploy src/modal_app.py

  deploy_prd:
    name: Deploy to PRD - Modal
    runs-on: ubuntu-latest
    needs: deploy_qas
    environment:
      name: prod

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      DOCKER_IMAGE_TAG: devchuz/mlops-fastapi-microservice:${{ github.sha }}
      MODAL_APP_NAME: mlops-fastapi-prd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          pip install modal

      - name: Deploy to Modal PRD
        run: |
          modal deploy src/modal_app.py