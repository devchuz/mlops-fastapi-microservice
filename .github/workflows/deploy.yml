name: Deploy FastAPI with QAS and PRD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mlops-fastapi-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_IMAGE: devchuz/mlops-fastapi-microservice

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-root

      - name: Run tests
        run: |
          poetry run python -m pytest tests/ -v

  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            devchuz/mlops-fastapi-microservice:latest
            devchuz/mlops-fastapi-microservice:${{ github.sha }}

  deploy_qas:
    name: Deploy to QAS - Modal
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: qas

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      DOCKER_IMAGE_TAG: devchuz/mlops-fastapi-microservice:${{ github.sha }}
      MODAL_APP_NAME: mlops-fastapi-qas

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          pip install modal

      - name: Deploy to Modal QAS
        run: |
          modal deploy src/modal_app.py

  validate_qas:
    name: Validate QAS and upload artifact
    runs-on: ubuntu-latest
    needs: deploy_qas
    environment:
      name: qas

    steps:
      - name: Wait for QAS endpoint
        run: |
          sleep 20

      - name: Validate QAS health endpoint
        run: |
          curl -f "${{ vars.MODAL_BASE_URL }}/api/v1/health"

      - name: Capture QAS github-ascii endpoint
        run: |
          mkdir -p artifacts/qas

          echo "QAS Endpoint:" > artifacts/qas/qas-github-ascii.txt
          echo "${{ vars.MODAL_BASE_URL }}/api/v1/github-ascii" >> artifacts/qas/qas-github-ascii.txt
          echo "" >> artifacts/qas/qas-github-ascii.txt

          curl -f "${{ vars.MODAL_BASE_URL }}/api/v1/github-ascii" >> artifacts/qas/qas-github-ascii.txt

      - name: Upload QAS artifact
        uses: actions/upload-artifact@v4
        with:
          name: qas-github-ascii
          path: artifacts/qas/qas-github-ascii.txt

  deploy_prd:
    name: Deploy to PRD - Modal
    runs-on: ubuntu-latest
    needs: validate_qas
    environment:
      name: prod

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      DOCKER_IMAGE_TAG: devchuz/mlops-fastapi-microservice:${{ github.sha }}
      MODAL_APP_NAME: mlops-fastapi-prd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          pip install modal

      - name: Deploy to Modal PRD
        run: |
          modal deploy src/modal_app.py

  validate_prd:
    name: Validate PRD and upload artifact
    runs-on: ubuntu-latest
    needs: deploy_prd
    environment:
      name: prod

    steps:
      - name: Wait for PRD endpoint
        run: |
          sleep 20

      - name: Validate PRD health endpoint
        run: |
          curl -f "${{ vars.MODAL_BASE_URL }}/api/v1/health"

      - name: Capture PRD github-ascii endpoint
        run: |
          mkdir -p artifacts/prd

          echo "PRD Endpoint:" > artifacts/prd/prd-github-ascii.txt
          echo "${{ vars.MODAL_BASE_URL }}api/v1/github-ascii" >> artifacts/prd/prd-github-ascii.txt
          echo "" >> artifacts/prd/prd-github-ascii.txt

          curl -f "${{ vars.MODAL_BASE_URL }}api/v1/github-ascii" >> artifacts/prd/prd-github-ascii.txt

      - name: Upload PRD artifact
        uses: actions/upload-artifact@v4
        with:
          name: prd-github-ascii
          path: artifacts/prd/prd-github-ascii.txt